name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android
        run: |
          flutter create . --org com.jasanet --project-name mas_mobile --platforms android
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          # Set Android app icon in manifest to launcher_icon
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Configure persistent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.p12
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          text = text.replace('    buildTypes {', '''    signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storeType = "PKCS12"
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "mas-release"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {''')
          assert 'signingConfigs.getByName("debug")' in text
          text = text.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          path.write_text(text)
          PYTHON

      - name: Build APK (Release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Get tag or generate release name
        id: release_info
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="v1.0.5"
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: MAS Mobile ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## Mitra-Asset System (MAS) Mobile Release ${{ steps.release_info.outputs.tag }}
            - Jam check-in dan check-out hari ini ditampilkan dalam WIB
            - Preview kamera menjaga rasio asli; wajah tidak dipaksa mengikuti ukuran kotak
            - Perbaikan pengiriman token CSRF untuk check-in/check-out
            - Signing key tetap untuk update berikutnya; instalasi lama perlu uninstall sekali
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
